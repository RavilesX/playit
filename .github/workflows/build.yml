name: Build ejecutables

# Cuándo corre: en cada push a main y al crear un tag vX.Y.Z (release).
# También se puede lanzar a mano desde la pestaña Actions de GitHub.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ---------- LINUX ----------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg portaudio19-dev libsndfile1 libxcb-cursor0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 sounddevice soundfile numpy requests mutagen Pillow psutil syncedlyrics qrcode pyinstaller

      - name: Inyectar versión desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > version.py

      - name: Compilar con PyInstaller
        run: pyinstaller --clean -y PlayIt.spec

      # tar preserva el bit de ejecución; upload-artifact y los assets de
      # release lo pierden si se sube el binario suelto. Se incluye el icono
      # para que el usuario pueda crear su lanzador .desktop
      - name: Empaquetar binario Linux
        run: |
          cp images/main_window/main_icon.png dist/
          tar -czf PlayIt-linux.tar.gz -C dist PlayIt main_icon.png

      - name: Subir ejecutable Linux
        uses: actions/upload-artifact@v4
        with:
          name: PlayIt-linux
          path: PlayIt-linux.tar.gz

  # ---------- WINDOWS ----------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 sounddevice soundfile numpy requests mutagen Pillow psutil syncedlyrics qrcode pyinstaller

      - name: Inyectar versión desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > version.py

      - name: Compilar con PyInstaller
        run: pyinstaller --clean -y PlayIt.spec

      - name: Subir ejecutable Windows
        uses: actions/upload-artifact@v4
        with:
          name: PlayIt-windows
          path: dist/PlayIt.exe

  # ---------- MACOS (Apple Silicon; usar macos-13 para Intel) ----------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 sounddevice soundfile numpy requests mutagen Pillow psutil syncedlyrics qrcode pyinstaller

      - name: Inyectar versión desde el tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > version.py

      - name: Compilar con PyInstaller
        run: pyinstaller --clean -y PlayIt.spec

      # ditto preserva permisos de ejecución y symlinks del bundle,
      # que upload-artifact perdería si se sube la carpeta .app directa
      - name: Comprimir PlayIt.app
        run: ditto -c -k --keepParent dist/PlayIt.app PlayIt-macos.zip

      - name: Subir ejecutable macOS
        uses: actions/upload-artifact@v4
        with:
          name: PlayIt-macos
          path: PlayIt-macos.zip

  # ---------- RELEASE (solo en tags v*) ----------
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # necesario para crear la Release
    steps:
      - name: Descargar ejecutable Linux
        uses: actions/download-artifact@v4
        with:
          name: PlayIt-linux
          path: linux

      - name: Descargar ejecutable Windows
        uses: actions/download-artifact@v4
        with:
          name: PlayIt-windows
          path: windows

      - name: Descargar ejecutable macOS
        uses: actions/download-artifact@v4
        with:
          name: PlayIt-macos
          path: macos

      - name: Renombrar con la versión
        run: |
          mv linux/PlayIt-linux.tar.gz PlayIt-${GITHUB_REF_NAME}-linux.tar.gz
          mv windows/PlayIt.exe        PlayIt-${GITHUB_REF_NAME}-windows.exe
          mv macos/PlayIt-macos.zip    PlayIt-${GITHUB_REF_NAME}-macos.zip

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PlayIt-${{ github.ref_name }}-linux.tar.gz
            PlayIt-${{ github.ref_name }}-windows.exe
            PlayIt-${{ github.ref_name }}-macos.zip
          generate_release_notes: true
